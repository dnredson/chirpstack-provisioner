[package]
name = "chirpstack-provisioner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Declarative, idempotent ChirpStack resource provisioner for DATUM"

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tonic = { version = "0.14", features = ["transport"] }
prost = "0.14"
prost-types = "0.14"
chirpstack_api = { git = "https://github.com/chirpstack/chirpstack", tag = "v4.19.1", package = "chirpstack_api", default-features = false, features = ["api", "internal"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
