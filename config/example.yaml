server:
  bind: 0.0.0.0:8085

chirpstack:
  endpoint: http://chirpstack:8080
  bootstrap:
    email_env: CHIRPSTACK_BOOTSTRAP_EMAIL
    password_env: CHIRPSTACK_BOOTSTRAP_PASSWORD
    default_email: admin
    default_password: admin
    api_key_name: datum-chirpstack-provisioner
    token_path: /var/lib/chirpstack-provisioner/api-token
  timeout_seconds: 15

# This file must live on a writable persistent volume when the dynamic API is used.
plan_path: /var/lib/chirpstack-provisioner/desired.yaml
bootstrap_plan_path: /etc/chirpstack-provisioner/desired.yaml
state_path: /var/lib/chirpstack-provisioner/state.json

